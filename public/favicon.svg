<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gaiwan bowl (tea bowl) -->
  <path
    d="M6 11C6 11 6 17 12 17C18 17 18 11 18 11"
    stroke="#d4bcff"
    stroke-width="1.4"
    stroke-linecap="round"
  />
  <!-- Gaiwan saucer/base -->
  <ellipse cx="12" cy="18" rx="4" ry="1.2" stroke="#d4bcff" stroke-width="1.2" />
  <!-- Gaiwan lid (tilted open) -->
  <ellipse cx="13" cy="8" rx="4" ry="1.5" stroke="#d4bcff" stroke-width="1.2" transform="rotate(-15 13 8)" />
  <!-- Lid knob -->
  <ellipse cx="15" cy="6.5" rx="0.8" ry="0.5" stroke="#d4bcff" stroke-width="1" />
  <!-- Internal chip revealed -->
  <rect
    x="9.5"
    y="11.5"
    width="5"
    height="4"
    rx="0.5"
    stroke="#d4bcff"
    stroke-width="1"
  />
  <!-- Chip circuit traces extending like branches -->
  <line x1="9.5" y1="12.5" x2="7.5" y2="11" stroke="#d4bcff" stroke-width="0.8" stroke-linecap="round" />
  <line x1="9.5" y1="14.5" x2="7" y2="15" stroke="#d4bcff" stroke-width="0.8" stroke-linecap="round" />
  <line x1="14.5" y1="12.5" x2="16.5" y2="11" stroke="#d4bcff" stroke-width="0.8" stroke-linecap="round" />
  <line x1="14.5" y1="14.5" x2="17" y2="15" stroke="#d4bcff" stroke-width="0.8" stroke-linecap="round" />
  <!-- Circuit trace nodes (leaf-like endpoints) -->
  <circle cx="7.5" cy="11" r="0.5" fill="#d4bcff" />
  <circle cx="7" cy="15" r="0.5" fill="#d4bcff" />
  <circle cx="16.5" cy="11" r="0.5" fill="#d4bcff" />
  <circle cx="17" cy="15" r="0.5" fill="#d4bcff" />
</svg>
